<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>현장 손상 표기</title>
<meta name="theme-color" content="#1c5da3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
*,*::before,*::after{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one-screen field tool — header / tool rail | drawing viewport | damage list. Narrow: rail moves to the bottom, list becomes a sheet. */
:root{
  --bg:#e9edf1; --panel:#fbfcfd; --panel-2:#f2f5f8; --ink:#17212c; --muted:#5a6775; --line:#d3dae2;
  --accent:#1c5da3; --accent-ink:#ffffff; --accent-soft:#dce8f5;
  --st-new:#d3312a; --st-chg:#d98200; --st-fix:#1e8749; --st-same:#6a7988;
  --paper-shadow:0 1px 3px rgba(20,32,44,.18),0 6px 24px rgba(20,32,44,.10);
  --f-body:"Samsung Sans","SamsungOneKorean","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --f-num:"Roboto Mono",ui-monospace,"Consolas",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1419; --panel:#171e26; --panel-2:#1d2630; --ink:#e4e9ee; --muted:#93a1af; --line:#2a3541;
  --accent:#5c9be0; --accent-ink:#0b1622; --accent-soft:#1b2d42;
  --st-new:#ff5d52; --st-chg:#f2a32c; --st-fix:#3fbf73; --st-same:#8c9bab;
  --paper-shadow:0 1px 3px rgba(0,0,0,.5),0 8px 28px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1419; --panel:#171e26; --panel-2:#1d2630; --ink:#e4e9ee; --muted:#93a1af; --line:#2a3541;
  --accent:#5c9be0; --accent-ink:#0b1622; --accent-soft:#1b2d42;
  --st-new:#ff5d52; --st-chg:#f2a32c; --st-fix:#3fbf73; --st-same:#8c9bab;
  --paper-shadow:0 1px 3px rgba(0,0,0,.5),0 8px 28px rgba(0,0,0,.45); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:72px minmax(0,1fr) 330px;grid-template-areas:"top top top" "rail view side"}
.app.noside{grid-template-columns:72px minmax(0,1fr) 0}

/* top bar */
.top{grid-area:top;display:flex;align-items:center;gap:10px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line);min-width:0;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:4px}
.brand b{font-size:15px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.pager{display:flex;align-items:center;gap:4px;min-width:0}
.pager select{height:38px;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:0 10px;max-width:260px;min-width:0}
.ib{height:38px;min-width:38px;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;white-space:nowrap}
.ib:hover{border-color:var(--accent)}
.ib.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.ib svg{width:18px;height:18px;flex:none}
.spacer{flex:1}
.top .ib .lbl{font-size:13px}

/* rail */
.rail{grid-area:rail;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:8px 6px;padding-left:max(6px,env(safe-area-inset-left,0px));overflow-y:auto}
.tool{border:0;background:transparent;border-radius:10px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted)}
.tool svg{width:24px;height:24px}
.tool:hover{background:var(--panel-2);color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rail hr{border:0;border-top:1px solid var(--line);margin:4px 6px}

/* viewport */
.view{grid-area:view;position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:
  linear-gradient(var(--bg),var(--bg))}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:var(--paper-shadow);background:#fff}
.stage canvas{display:block;position:absolute;inset:0}
.stage svg{position:absolute;inset:0;overflow:visible}
.view.t-line,.view.t-rect,.view.t-pin,.view.t-ref{cursor:crosshair}
.view.t-pan{cursor:grab}
.hud{position:absolute;left:12px;bottom:12px;display:flex;gap:8px;align-items:center;pointer-events:none;flex-wrap:wrap;right:12px}
.hud .pill{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--muted);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.hud .pill button{border:0;background:none;padding:0;color:var(--accent);font-weight:600}
.banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;gap:10px;align-items:center;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.08);max-width:calc(100% - 24px)}
.banner button{border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:4px 9px;font-size:12.5px;white-space:nowrap}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}

/* side list */
.side{grid-area:side;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.app.noside .side{display:none}
.side-h{padding:12px 16px 10px;padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.side-h h2{margin:0;font-size:15px;font-weight:700;text-wrap:balance}
.side-h .sub{font-size:12px;color:var(--muted)}
.counts{display:flex;gap:6px;flex-wrap:wrap}
.cnt{display:inline-flex;align-items:center;gap:5px;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;background:var(--panel-2)}
.cnt button{all:unset}
.cnt[aria-pressed="true"]{border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.list{flex:1;overflow-y:auto;padding:6px 8px 16px;padding-right:max(8px,env(safe-area-inset-right,0px))}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 8px;border-radius:9px;border:1px solid transparent;width:100%;text-align:left;background:none}
.row:hover{background:var(--panel-2)}
.row.sel{border-color:var(--accent);background:var(--accent-soft)}
.row .no{font-family:var(--f-num);font-size:13px;min-width:28px;height:24px;border-radius:12px;display:grid;place-items:center;color:#fff;padding:0 6px}
.row .t{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{grid-column:2/4;font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.row .st{font-size:11.5px;color:var(--muted)}
.empty{padding:28px 14px;color:var(--muted);font-size:13px;line-height:1.6;text-align:center}
.side-f{border-top:1px solid var(--line);padding:10px 16px;padding-right:max(16px,env(safe-area-inset-right,0px));font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}

/* editor sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.28);z-index:20}
.sheet{position:fixed;z-index:21;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.12);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px;padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.sheet-h h3{margin:0;font-size:16px;flex:1}
.sheet-b{flex:1;overflow-y:auto;padding:14px 16px 20px;padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.sheet-f{display:flex;gap:8px;padding:12px 16px;padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line)}
.sheet-f .grow{flex:1}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.lab{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.in{height:42px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:0 11px;width:100%;min-width:0}
textarea.in{height:68px;padding:9px 11px;resize:vertical}
.grid2{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 84px;gap:8px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--panel-2);padding:10px 0;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:7px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.qty{display:flex;justify-content:space-between;align-items:baseline;background:var(--panel-2);border:1px dashed var(--line);border-radius:8px;padding:9px 12px}
.qty b{font-family:var(--f-num);font-size:17px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{position:relative;width:76px;height:76px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--panel-2)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1}
.addph{width:76px;height:76px;border-radius:8px;border:1.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--muted);cursor:pointer}
.addph svg{width:22px;height:22px}
.btn{height:44px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);padding:0 16px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--st-new);border-color:transparent;background:none;padding:0 8px}
.btn.danger.arm{background:var(--st-new);color:#fff}
.x{border:0;background:none;width:36px;height:36px;border-radius:8px;font-size:20px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);line-height:1.5;margin:0}

/* modal */
.modal{position:fixed;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:18px;display:flex;flex-direction:column;gap:14px}
.modal h3{margin:0;font-size:16px}
.modal p{margin:0;color:var(--muted);line-height:1.55;font-size:13.5px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;z-index:40;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:9px;font-size:13.5px;max-width:calc(100% - 32px)}

/* narrow */
@media (max-width:760px){
  .app,.app.noside{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto;grid-template-areas:"top" "view" "rail"}
  .rail{flex-direction:row;overflow-x:auto;border-right:0;border-top:1px solid var(--line);padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tool{min-width:62px}
  .rail hr{display:none}
  .side{position:fixed;z-index:15;left:0;right:0;bottom:0;height:60%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.15)}
  .app.noside .side{display:none}
  .sheet{top:auto;height:86%;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0}
  .brand span{max-width:140px}
  .top .lbl{display:none}
  .grid4{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid4 .unitf{grid-column:1/-1}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slidein .18s ease-out}@keyframes slidein{from{transform:translateX(24px);opacity:.6}}}
.loading .btn{margin-top:14px;height:48px;padding:0 22px;display:inline-flex;align-items:center}
.loading div{text-align:center;line-height:1.7}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><b>현장 손상 표기</b><span id="fileName">도면을 불러오는 중</span></div>
    <div class="pager">
      <button class="ib" id="prevPg" aria-label="이전 도면"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button>
      <select id="pageSel" aria-label="도면 선택"></select>
      <button class="ib" id="nextPg" aria-label="다음 도면"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div class="spacer"></div>
    <label class="ib" for="pdfInput" title="도면 PDF 열기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7a2 2 0 012-2h4l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H6a2 2 0 01-2-2z"/></svg><span class="lbl">도면 열기</span></label>
    <input type="file" id="pdfInput" accept="application/pdf,.pdf" hidden>
    <label class="ib" for="bakInput" title="내보낸 zip 또는 json 백업 불러오기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20V9m0 0l-4 4m4-4l4 4M5 4h14"/></svg><span class="lbl">백업 불러오기</span></label>
    <input type="file" id="bakInput" accept=".zip,.json,application/zip,application/json" hidden>
    <button class="ib" id="toggleSide" aria-pressed="true" title="손상 목록"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg><span class="lbl">목록</span></button>
    <button class="ib" id="installBtn" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="2.5" width="12" height="19" rx="2"/><path d="M12 7v7m0 0l-3-3m3 3l3-3"/></svg><span class="lbl">앱 설치</span></button>
    <button class="ib primary" id="exportBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg><span class="lbl">내보내기</span></button>
  </header>

  <nav class="rail" id="rail" aria-label="도구">
    <button class="tool" data-tool="select" title="선택 (V)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 3l14 8-6 2-3 6z"/></svg>선택</button>
    <button class="tool" data-tool="line" title="균열선 (L)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19l4-6 3 2 4-7 2 3 3-6"/></svg>균열선</button>
    <button class="tool" data-tool="rect" title="영역 (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="6" width="16" height="12" rx="1"/><path d="M4 10l6-4M4 16l12-10M8 18l12-8M14 18l6-4" stroke-width="1"/></svg>영역</button>
    <button class="tool" data-tool="pin" title="기존 손상 (P)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="11" r="6"/><path d="M12 8v6M9 11h6" stroke-width="1.4"/></svg>기존손상</button>
    <hr>
    <button class="tool" data-tool="pan" title="이동 (H)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v18M3 12h18M12 3l-3 3m3-3l3 3M12 21l-3-3m3 3l3-3M3 12l3-3m-3 3l3 3M21 12l-3-3m3 3l-3 3"/></svg>이동</button>
    <button class="tool" data-tool="ref" title="CAD 기준점"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg>기준점</button>
    <button class="tool" id="fitBtn" title="도면 맞춤"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>맞춤</button>
    <button class="tool" id="undoBtn" title="되돌리기 (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>되돌리기</button>
    <button class="tool" id="fingerBtn" aria-pressed="false" title="펜이 없을 때 손가락으로 그리기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 11V5a1.5 1.5 0 013 0v5m0-1a1.5 1.5 0 013 0v2m0-1a1.5 1.5 0 013 0v4a6 6 0 01-6 6h-1a6 6 0 01-5-3l-2.5-4a1.5 1.5 0 012.5-1.6L9 15"/></svg>손가락펜</button>
  </nav>

  <main class="view t-line" id="view">
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <svg id="ov" xmlns="http://www.w3.org/2000/svg">
        <g id="gMarks"></g><g id="gRef"></g><g id="gDraft"></g>
      </svg>
    </div>
    <div class="loading" id="loading">도면을 불러오는 중…</div>
    <div class="banner" id="exBanner" hidden><span>예시 표기 3건이 들어 있습니다.</span><button id="clearEx">예시 지우기</button></div>
    <div class="hud">
      <span class="pill" id="hintPill">S펜으로 그리면 손상이 추가되고, 손가락으로 끌거나 벌리면 도면이 움직입니다.</span>
      <span class="pill num" id="zoomPill">100%</span>
      <span class="pill" id="refPill" hidden></span>
    </div>
  </main>

  <aside class="side" id="side" aria-label="손상 목록">
    <div class="side-h">
      <h2 id="sideTitle">손상 목록</h2>
      <div class="sub" id="sideSub"></div>
      <div class="counts" id="counts"></div>
    </div>
    <div class="list" id="list"></div>
    <div class="side-f"><span id="totalAll"></span><span id="saveState">저장됨</span></div>
  </aside>
</div>

<div id="sheetRoot"></div>
<div id="modalRoot"></div>

<script src="vendor/pdf.min.js"></script>
</body>
</html>
<script src="vendor/jszip.min.js"></script>
</body>
</html>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------- domain ---------- */
const STATUS = {
  new:  {label:'신규',     css:'var(--st-new)',  layer:'FIELD_NEW',  aci:1},
  chg:  {label:'변경',     css:'var(--st-chg)',  layer:'FIELD_CHG',  aci:30},
  fix:  {label:'보수완료', css:'var(--st-fix)',  layer:'FIELD_FIX',  aci:3},
  same: {label:'변동없음', css:'var(--st-same)', layer:'FIELD_SAME', aci:8},
};
const ST_ORDER = ['new','chg','fix','same'];
const TYPES = ['균열','망상균열','재료분리','파손·박리','철근노출','백태','누수오염','표면오염','표면열화','마모','침식','부식','강판부식','렉바부식','소성변형','좌굴·변형','불량','이물질퇴적','배수구'];
const KEYWORDS = ['망상균열','균열','재료분리','파손','박리','철근노출','백태','누수','표면오염','표면열화','마모','침식','강판부식','렉바부식','부식','소성변형','좌굴','변형','불량','이물질퇴적','배수구','들뜸','박락'];
const MEMBERS = ['바닥판','거더','가로보','교대','교각','받침','신축이음','난간','배수시설','문기둥','조작대','문틀','문비','렉바','권양기','날개벽','물받이공','관리교','배수암거'];
const isCrack = t => /균열/.test(t) && !/망상/.test(t);
const defaultUnit = t => isCrack(t) ? 'm' : (/렉바|배수구|불량/.test(t) ? 'EA' : '㎡');
const num = v => { const x = parseFloat(String(v).replace(',', '.')); return isFinite(x) ? x : 0; };
function calcQty(m){
  const n = num(m.n) || 0;
  let q = m.unit === '㎡' ? num(m.w) * num(m.l) * n : m.unit === 'm' ? num(m.l) * n : n;
  return Math.round(q * 100) / 100;
}
function dimsText(m){
  const n = num(m.n);
  if (isCrack(m.type)) return [m.crackW ? `w=${m.crackW}mm` : '', m.l ? `L=${m.l}m` : '', n > 1 ? `${n}EA` : ''].filter(Boolean).join(' ');
  if (m.unit === 'EA') return n ? `${n}ea` : '';
  return [(m.w || m.l) ? `${m.w || '?'}x${m.l || '?'}` : '', n > 1 ? `${n}EA` : ''].filter(Boolean).join(', ');
}

/* ---------- storage (IndexedDB, per device) ---------- */
let dbp = null, storageOk = true;
const memKV = new Map(), memPhotos = new Map();
function idb(){
  if (!dbp) dbp = new Promise((res, rej) => {
    try {
      const r = indexedDB.open('field-damage', 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('photos'); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
  return dbp;
}
async function dbGet(store, key){
  try { const d = await idb(); return await new Promise((res, rej) => { const q = d.transaction(store).objectStore(store).get(key); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
  catch (e) { return (store === 'photos' ? memPhotos : memKV).get(key); }
}
async function dbSet(store, key, val){
  (store === 'photos' ? memPhotos : memKV).set(key, val);
  try { const d = await idb(); await new Promise((res, rej) => { const t = d.transaction(store, 'readwrite'); t.objectStore(store).put(val, key); t.oncomplete = res; t.onerror = () => rej(t.error); }); return true; }
  catch (e) { if (storageOk) { storageOk = false; toast('이 브라우저에는 저장할 수 없습니다. 작업 후 꼭 내보내기를 하세요.', 5000); } return false; }
}
async function dbDel(store, key){
  (store === 'photos' ? memPhotos : memKV).delete(key);
  try { const d = await idb(); await new Promise((res) => { const t = d.transaction(store, 'readwrite'); t.objectStore(store).delete(key); t.oncomplete = res; t.onerror = res; }); } catch (e) {}
}

function modal({title, body = '', html = '', ok = '확인', cancel = '취소', onOpen}){

/* ---------- PDF ---------- */
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';
let renderTask = null;

async function analyzePage(n){
  const page = await pdfDoc.getPage(n);
  const vp = page.getViewport({scale:1});
  const info = {W:vp.width, H:vp.height, title:'', guess:0};
  try {
    const tc = await page.getTextContent();
    const items = tc.items.map(it => {
      const [x, y] = vp.convertToViewportPoint(it.transform[4], it.transform[5]);
      return {s:(it.str || '').trim(), x, y, h:Math.hypot(it.transform[2], it.transform[3])};
    }).filter(i => i.s);
    const re = new RegExp(KEYWORDS.join('|'), 'g');
    for (const it of items) {
      if (it.x < info.W * 0.64 && it.y < info.H * 0.9 && it.y > info.H * 0.1) {
        const m = it.s.match(re); if (m) info.guess += m.length > 1 && /\d/.test(it.s) ? m.length : 1;
      }
    }
    const tl = items.filter(i => i.x < info.W * 0.4 && i.y < info.H * 0.12 && i.s.replace('◈','').trim().length > 1 && !/KEY|PLAN/.test(i.s));
    if (tl.length) info.title = tl.sort((a, b) => b.h - a.h)[0].s.replace('◈','').trim();
    if (!info.title) {
      const big = items.filter(i => i.s.length > 1).sort((a, b) => b.h - a.h)[0];
      if (big && items.length < 40) info.title = items.map(i => i.s).join('').slice(0, 14);
    }
  } catch (e) {}
  pageInfo[n] = info;
}

async function openPdf(bytes, name, opts = {}){
  $('#loading').hidden = false; $('#loading').textContent = '도면을 불러오는 중…';
  const key = name + '|' + bytes.byteLength;
  try {
    pdfDoc = await pdfjsLib.getDocument({data: bytes.slice(0)}).promise;
  } catch (e) {
    $('#loading').textContent = 'PDF를 열 수 없습니다. 다른 파일을 선택해 주세요.'; console.error(e); return;
  }
  for (const k in pageInfo) delete pageInfo[k];
  for (let i = 1; i <= pdfDoc.numPages; i++) await analyzePage(i);
  let p = await dbGet('kv', 'proj:' + key);
  if (!p) {
    p = {key, name, created:Date.now(), pages:{}, marks:[], lastPage:1};
    if (opts.examples) { p.marks = exampleMarks(); p.lastPage = 2; }
  }
  proj = p; undoStack = []; selectedId = null;
  dbSet('kv', 'pdf:' + key, bytes); dbSet('kv', 'last', key); saveProj();
  $('#fileName').textContent = name; $('#fileName').title = name;
  buildPageSel();
  await showPage(clamp(proj.lastPage || 1, 1, pdfDoc.numPages));
  $('#loading').hidden = true;
}

function buildPageSel(){
  const sel = $('#pageSel'); sel.innerHTML = '';
  for (let i = 1; i <= pdfDoc.numPages; i++) {
    const c = pageMarks(i).length;
    const o = document.createElement('option'); o.value = i;
    o.textContent = `${pad2(i)}  ${pageInfo[i]?.title || '도면 ' + i}${c ? `  (${c})` : ''}`;
    sel.appendChild(o);
  }
  sel.value = pageNo;
}

async function showPage(n){
  pageNo = n; proj.lastPage = n; saveProj(); selectedId = null;
  const page = await pdfDoc.getPage(n);
  const vp1 = page.getViewport({scale:1}); W = vp1.width; H = vp1.height;
  const st = els.stage; st.style.width = W + 'px'; st.style.height = H + 'px';
  els.ov.setAttribute('viewBox', `0 0 ${W} ${H}`); els.ov.setAttribute('width', W); els.ov.setAttribute('height', H);
  fit(); refresh();
  const q = Math.min(4, Math.sqrt(14e6 / (W * H)));
  const vp = page.getViewport({scale:q});
  const off = document.createElement('canvas'); off.width = Math.floor(vp.width); off.height = Math.floor(vp.height);
  const ctx = off.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, off.width, off.height);
  if (renderTask) { try { renderTask.cancel(); } catch (e) {} }
  renderTask = page.render({canvasContext:ctx, viewport:vp});
  try {
    await renderTask.promise;
    if (pageNo !== n) return;
    const cv = els.cv; cv.width = off.width; cv.height = off.height; cv.style.width = W + 'px'; cv.style.height = H + 'px';
    cv.getContext('2d').drawImage(off, 0, 0);
  } catch (e) { if (e?.name !== 'RenderingCancelledException') console.error(e); }
}

/* ---------- view transform ---------- */
function applyView(){
  els.stage.style.transform = `translate(${view.tx}px,${view.ty}px) scale(${view.s})`;
  $('#zoomPill').textContent = Math.round(view.s * 100) + '%';
  scheduleDraw();
}
function fit(){
  const r = els.view.getBoundingClientRect();
  const pad = r.width < 600 ? 8 : 24;
  view.s = Math.min((r.width - pad * 2) / W, (r.height - pad * 2 - 30) / H);
  view.tx = (r.width - W * view.s) / 2; view.ty = (r.height - 30 - H * view.s) / 2;
  applyView();
}
function zoomAt(cx, cy, ns){
  const r = els.view.getBoundingClientRect();
  ns = clamp(ns, 0.15, 14);
  const px = (cx - r.left - view.tx) / view.s, py = (cy - r.top - view.ty) / view.s;
  view.s = ns; view.tx = cx - r.left - px * ns; view.ty = cy - r.top - py * ns; applyView();
}
function toPage(e){ const r = els.view.getBoundingClientRect(); return {x:(e.clientX - r.left - view.tx) / view.s, y:(e.clientY - r.top - view.ty) / view.s}; }
let drawQueued = false;
function scheduleDraw(){ if (drawQueued) return; drawQueued = true; requestAnimationFrame(() => { drawQueued = false; drawMarks(); drawRef(); }); }

/* ---------- drawing marks ---------- */
const NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; }
function anchorOf(m){
  if (m.kind === 'rect') return [Math.max(m.pts[0][0], m.pts[1][0]), Math.min(m.pts[0][1], m.pts[1][1])];
  if (m.kind === 'pin') return m.pts[0];
  let best = m.pts[0]; for (const p of m.pts) if (p[1] < best[1]) best = p; return best;
}
function drawMarks(){
  const g = els.gMarks; g.innerHTML = '';
  if (!proj) return;
  const k = 1 / view.s;
  for (const m of pageMarks()) {
    const col = STATUS[m.status]?.css || STATUS.new.css;
    const sel = m.id === selectedId;
    const grp = svgEl('g', {style:`color:${col}`}, g);
    const sw = sel ? 4 : 2.4;
    if (m.kind === 'line') {
      const pts = m.pts.map(p => p.join(',')).join(' ');
      if (sel) svgEl('polyline', {points:pts, fill:'none', stroke:'#fff', 'stroke-width':sw + 4, 'vector-effect':'non-scaling-stroke', 'stroke-linecap':'round', 'stroke-linejoin':'round', opacity:.9}, grp);
      svgEl('polyline', {points:pts, fill:'none', stroke:'currentColor', 'stroke-width':sw, 'vector-effect':'non-scaling-stroke', 'stroke-linecap':'round', 'stroke-linejoin':'round', 'stroke-dasharray': m.status === 'fix' ? '6 4' : ''}, grp);
    } else if (m.kind === 'rect') {
      const [a, b] = m.pts; const x = Math.min(a[0], b[0]), y = Math.min(a[1], b[1]), w = Math.abs(a[0] - b[0]), h = Math.abs(a[1] - b[1]);
      svgEl('rect', {x, y, width:w, height:h, fill:'currentColor', 'fill-opacity': .22, stroke:'currentColor', 'stroke-width':sw, 'vector-effect':'non-scaling-stroke', 'stroke-dasharray': m.status === 'fix' ? '6 4' : ''}, grp);
      if (m.status === 'fix') { svgEl('path', {d:`M${x},${y}L${x + w},${y + h}M${x + w},${y}L${x},${y + h}`, stroke:'currentColor', 'stroke-width':2, 'vector-effect':'non-scaling-stroke'}, grp); }
    } else {
      const [x, y] = m.pts[0];
      svgEl('circle', {cx:x, cy:y, r:11 * k, fill:'currentColor', stroke:'#fff', 'stroke-width':(sel ? 3 : 1.5) * k}, grp);
      const t = svgEl('text', {x, y: y + 4 * k, 'text-anchor':'middle', 'font-size':11 * k, 'font-weight':700, fill:'#fff', 'font-family':'Roboto Mono, monospace'}, grp);
      t.textContent = m.no || '?';
    }
    const [ax, ay] = anchorOf(m);
    const label = (m.kind === 'pin' ? '' : (m.no ? m.no + ' ' : '')) + m.type + (m.kind === 'pin' ? ` · ${STATUS[m.status].label}` : '');
    const tx = m.kind === 'pin' ? ax + 14 * k : ax + 4 * k, ty = m.kind === 'pin' ? ay + 4 * k : ay - 5 * k;
    const lt = svgEl('text', {x:tx, y:ty, 'font-size':11.5 * k, 'font-weight':600, fill:'currentColor', stroke:'#fff', 'stroke-width':3.2 * k, 'paint-order':'stroke', 'font-family':'sans-serif'}, grp);
    lt.textContent = label;
    const d = dimsText(m);
    if (d && view.s > 0.7) { const dt = svgEl('text', {x:tx, y:ty + 12.5 * k, 'font-size':10.5 * k, fill:'currentColor', stroke:'#fff', 'stroke-width':3 * k, 'paint-order':'stroke', 'font-family':'Roboto Mono, monospace'}, grp); dt.textContent = d; }
  }
}
function drawRef(){
  const g = els.gRef; g.innerHTML = '';
  const ref = proj?.pages?.[pageNo]?.ref; if (!ref) { $('#refPill').hidden = true; return; }
  const k = 1 / view.s;
  for (const key of ['a', 'b']) {
    const p = ref[key]; if (!p) continue;
    const grp = svgEl('g', {style:'color:var(--accent)'}, g);
    svgEl('circle', {cx:p.px, cy:p.py, r:7 * k, fill:'none', stroke:'currentColor', 'stroke-width':2 * k}, grp);
    svgEl('path', {d:`M${p.px - 13 * k},${p.py}H${p.px + 13 * k}M${p.px},${p.py - 13 * k}V${p.py + 13 * k}`, stroke:'currentColor', 'stroke-width':1.5 * k}, grp);
    const t = svgEl('text', {x:p.px + 9 * k, y:p.py - 9 * k, 'font-size':12 * k, 'font-weight':700, fill:'currentColor', stroke:'#fff', 'stroke-width':3 * k, 'paint-order':'stroke'}, grp);
    t.textContent = `${key.toUpperCase()} (${p.cx}, ${p.cy})`;
  }
  $('#refPill').hidden = false;
  $('#refPill').textContent = ref.a && ref.b ? '이 도면은 CAD 좌표로 내보냅니다' : '기준점 B를 찍어 주세요';
}

/* ---------- side list ---------- */
function renderList(){

  const info = pageInfo[pageNo] || {};
  $('#sideTitle').textContent = `${pad2(pageNo)} · ${info.title || '도면 ' + pageNo}`;
  const ms = pageMarks();

  const counts = $('#counts'); counts.innerHTML = '';
  for (const s of ST_ORDER) {
    const c = ms.filter(m => m.status === s).length;

    b.innerHTML = `<button><span class="dot" style="background:${STATUS[s].css}"></span> ${STATUS[s].label} <span class="num">${c}</span></button>`;
    b.querySelector('button').onclick = () => { statusFilter = statusFilter === s ? null : s; renderList(); };
    counts.appendChild(b);
  }
  const list = $('#list'); list.innerHTML = '';
  const shown = ms.filter(m => !statusFilter || m.status === statusFilter)
    .sort((a, b) => ST_ORDER.indexOf(a.status) - ST_ORDER.indexOf(b.status) || num(a.no) - num(b.no));
  if (!shown.length) {
    list.innerHTML = `<div class="empty">${ms.length ? '이 상태의 표기가 없습니다.' : '이 도면에는 아직 현장 표기가 없습니다.<br>균열선·영역 도구로 새 손상을 그리고,<br>기존손상 도구로 기존 번호를 찍어 변경·보수완료를 남기세요.'}</div>`;
  }
  for (const m of shown) {
    const b = document.createElement('button'); b.className = 'row' + (m.id === selectedId ? ' sel' : '');
    b.innerHTML = `<span class="no" style="background:${STATUS[m.status].css}">${esc(m.no || '?')}</span>
      <span class="t">${esc(m.type)}${m.member ? ` <span style="font-weight:400;color:var(--muted)">· ${esc(m.member)}</span>` : ''}</span>
      <span class="st">${STATUS[m.status].label}${m.example ? ' · 예시' : ''}</span>
      <span class="d"><span class="num">${esc(dimsText(m) || '치수 미입력')}</span>${m.qty ? `<span class="num">${m.qty}${m.unit}</span>` : ''}${m.photos?.length ? `<span>사진 ${m.photos.length}</span>` : ''}${m.memo ? `<span>${esc(m.memo.slice(0, 24))}</span>` : ''}</span>`;
    b.onclick = () => { selectedId = m.id; centerOn(m); refresh(); openEditor(m, false); };
    list.appendChild(b);
  }
  const all = proj.marks;
  $('#totalAll').textContent = `전체 ${all.length}건 · 신규 ${all.filter(m => m.status === 'new').length} · 변경 ${all.filter(m => m.status === 'chg').length} · 보수 ${all.filter(m => m.status === 'fix').length}`;
  $('#exBanner').hidden = !proj.marks.some(m => m.example);
}
function refresh(){ drawMarks(); drawRef(); renderList(); if (pdfDoc) { const sel = $('#pageSel'); const v = pageNo; buildPageSel(); sel.value = v; } }
function centerOn(m){
  const [x, y] = anchorOf(m); const r = els.view.getBoundingClientRect();
  if (view.s < 1.2) view.s = 1.6;
  const sideW = els.app.classList.contains('noside') ? 0 : 0;
  view.tx = (r.width - sideW) / 2 - x * view.s; view.ty = r.height / 2 - y * view.s; applyView();
}

/* ---------- numbering ---------- */
function nextNo(){
  const ms = pageMarks().filter(m => m.status === 'new' || m.kind !== 'pin');
  const maxMine = ms.reduce((a, m) => Math.max(a, parseInt(m.no) || 0), 0);
  return Math.max(pageInfo[pageNo]?.guess || 0, maxMine) + 1;
}
let lastMember = '', lastAreaType = '재료분리';

function newMark(kind, pts){
  const type = kind === 'line' ? '균열' : kind === 'rect' ? lastAreaType : '';
  return {id:uid(), page:pageNo, kind, pts, status: kind === 'pin' ? 'chg' : 'new',
    no: kind === 'pin' ? '' : String(nextNo()), member:lastMember, type, crackW:'', w:'', l:'', n:'1',
    unit: defaultUnit(type || '재료분리'), qty:0, memo:'', photos:[], t:Date.now()};

/* ---------- hit test ---------- */
function distSeg(p, a, b){

    else if (m.kind === 'rect') {

      d = (p.x >= x0 && p.x <= x1 && p.y >= y0 && p.y <= y1) ? 0 : Math.min(distSeg(p, [x0, y0], [x1, y0]), distSeg(p, [x1, y0], [x1, y1]), distSeg(p, [x1, y1], [x0, y1]), distSeg(p, [x0, y1], [x0, y0]));
    } else { d = Infinity; for (let i = 1; i < m.pts.length; i++) d = Math.min(d, distSeg(p, m.pts[i - 1], m.pts[i])); }
    if (d < tol && d < bd) { bd = d; best = m; }

}

  if (pts.length < 3) return pts;
  const keep = new Array(pts.length).fill(false); keep[0] = keep[pts.length - 1] = true;
  const st = [[0, pts.length - 1]];
  while (st.length) {
    const [i, j] = st.pop(); let md = 0, mi = -1;
    for (let k = i + 1; k < j; k++) { const d = distSeg({x:pts[k][0], y:pts[k][1]}, pts[i], pts[j]); if (d > md) { md = d; mi = k; } }
    if (md > eps) { keep[mi] = true; st.push([i, mi], [mi, j]); }
  }
  return pts.filter((_, i) => keep[i]).map(p => [Math.round(p[0] * 100) / 100, Math.round(p[1] * 100) / 100]);
}

/* ---------- tools ---------- */
let draft = null;

function drawDraft(){

  if (draft.kind === 'line') svgEl('polyline', {points:draft.pts.map(p => p.join(',')).join(' '), fill:'none', stroke:'currentColor', 'stroke-width':2.4, 'vector-effect':'non-scaling-stroke', 'stroke-linecap':'round', 'stroke-linejoin':'round'}, grp);
  if (draft.kind === 'rect') {

    svgEl('rect', {x, y, width:Math.abs(draft.p1.x - draft.p0.x), height:Math.abs(draft.p1.y - draft.p0.y), fill:'currentColor', 'fill-opacity':.2, stroke:'currentColor', 'stroke-width':2, 'stroke-dasharray':'5 3', 'vector-effect':'non-scaling-stroke'}, grp);

}
function toolDown(p){

  else if (tool === 'pin') { const hit = hitTest(p); if (hit && hit.kind === 'pin') openEditor(hit, false); else openEditor(newMark('pin', [[Math.round(p.x * 100) / 100, Math.round(p.y * 100) / 100]]), true); }
  else if (tool === 'select') { const m = hitTest(p); selectedId = m ? m.id : null; refresh(); if (m) openEditor(m, false); }

function toolUp(){

    if (d.pts.length < 2 || len < 5 / view.s) { const m = hitTest({x:d.pts[0][0], y:d.pts[0][1]}); if (m) { selectedId = m.id; refresh(); openEditor(m, false); } return; }
    openEditor(newMark('line', simplify(d.pts, 0.7 / view.s)), true);

    if (Math.abs(d.p1.x - d.p0.x) < 3 / view.s || Math.abs(d.p1.y - d.p0.y) < 3 / view.s) { const m = hitTest(d.p0); if (m) { selectedId = m.id; refresh(); openEditor(m, false); } return; }
    const r2 = v => Math.round(v * 100) / 100;
    openEditor(newMark('rect', [[r2(Math.min(d.p0.x, d.p1.x)), r2(Math.min(d.p0.y, d.p1.y))], [r2(Math.max(d.p0.x, d.p1.x)), r2(Math.max(d.p0.y, d.p1.y))]]), true);

/* ---------- pointer handling ---------- */
const touches = new Map();
let penId = null, penTouch = false, gesture = null, mousePan = null, spaceDown = false;
function gestureBase(){

  else if (pts.length >= 2) {
    const [a, b] = pts; gesture = {n:2, cx:(a.x + b.x) / 2, cy:(a.y + b.y) / 2, d:Math.hypot(a.x - b.x, a.y - b.y) || 1, s:view.s, tx:view.tx, ty:view.ty};

}
function gestureMove(){
  const pts = [...touches.values()]; if (!gesture) return;
  const r = els.view.getBoundingClientRect();
  if (gesture.n === 1 && pts.length === 1) { view.tx = gesture.tx + pts[0].x - gesture.x; view.ty = gesture.ty + pts[0].y - gesture.y; }
  else if (gesture.n === 2 && pts.length >= 2) {

const v = els.view;
v.addEventListener('pointerdown', e => {

    if (penId !== null && penTouch) { cancelDraft(); penId = null; penTouch = false; }  // second finger: switch to move/zoom
    touches.set(e.pointerId, {x:e.clientX, y:e.clientY});

  }

async function refPick(p){

  const res = await modal({

      collect:() => ({x:$('#refX').value.trim(), y:$('#refY').value.trim()})}

  const pt = {px:Math.round(p.x * 100) / 100, py:Math.round(p.y * 100) / 100, cx:+res.x, cy:+res.y};
  if (which === 'a') proj.pages[pageNo].ref = {a:pt}; else ref.b = pt, proj.pages[pageNo].ref = ref;
  saveProj(); drawRef();

}
function pageTransform(n){
  const info = pageInfo[n] || {W, H};
  const ref = proj.pages?.[n]?.ref;
  if (ref?.a && ref?.b) {
    const A = [ref.a.px, -ref.a.py], B = [ref.b.px, -ref.b.py], A2 = [ref.a.cx, ref.a.cy], B2 = [ref.b.cx, ref.b.cy];
    const dz = [B[0] - A[0], B[1] - A[1]], dw = [B2[0] - A2[0], B2[1] - A2[1]];
    const den = dz[0] * dz[0] + dz[1] * dz[1] || 1;
    const a = [(dw[0] * dz[0] + dw[1] * dz[1]) / den, (dw[1] * dz[0] - dw[0] * dz[1]) / den];
    const b = [A2[0] - (a[0] * A[0] - a[1] * A[1]), A2[1] - (a[0] * A[1] + a[1] * A[0])];
    return {cad:true, k:Math.hypot(a[0], a[1]), f:(x, y) => { const z = [x, -y]; return [a[0] * z[0] - a[1] * z[1] + b[0], a[0] * z[1] + a[1] * z[0] + b[1]]; }};

}

    syncFields();
    const d = e.d;
    if (!d.type) { toast('손상내용을 골라 주세요'); return; }
    if (d.kind === 'pin' && !d.no) { toast('기존 손상의 번호를 입력해 주세요'); $('#edNo').focus(); return; }
    d.qty = calcQty(d); delete d.example;
    pushUndo();
    if (e.isNew) proj.marks.push(d); else proj.marks = proj.marks.map(x => x.id === d.id ? d : x);
    e.removedPhotos.forEach(pid => dbDel('photos', pid));
    if (d.member) lastMember = d.member;
    if (d.kind === 'rect') lastAreaType = d.type;
    selectedId = d.id; saveProj();
    toast(e.isNew ? `${d.no ? d.no + '번 ' : ''}${d.type} 저장` : '수정했습니다');
  } else {
    e.addedPhotos.forEach(pid => dbDel('photos', pid));
    if (e.isNew) selectedId = null;
  }
  editing = null; $('#sheetRoot').innerHTML = ''; refresh();
}

/* ---------- export ---------- */
function dxfText(s){ return String(s).replace(/[^\x20-\x7e]/g, ch => '\\U+' + ch.codePointAt(0).toString(16).toUpperCase().padStart(4, '0')); }
function buildDxf(){
  const L = []; const g = (c, v) => { L.push(String(c)); L.push(typeof v === 'number' ? (Math.round(v * 10000) / 10000).toString() : String(v)); };
  const layers = [['FIELD_NEW', 1], ['FIELD_CHG', 30], ['FIELD_FIX', 3], ['FIELD_SAME', 8], ['FIELD_TEXT', 7], ['FIELD_FRAME', 9]];
  g(0, 'SECTION'); g(2, 'HEADER'); g(9, '$ACADVER'); g(1, 'AC1009'); g(9, '$DWGCODEPAGE'); g(3, 'ANSI_949'); g(0, 'ENDSEC');
  g(0, 'SECTION'); g(2, 'TABLES');
  g(0, 'TABLE'); g(2, 'LTYPE'); g(70, 1); g(0, 'LTYPE'); g(2, 'CONTINUOUS'); g(70, 0); g(3, 'Solid line'); g(72, 65); g(73, 0); g(40, 0); g(0, 'ENDTAB');
  g(0, 'TABLE'); g(2, 'LAYER'); g(70, layers.length);
  for (const [n, c] of layers) { g(0, 'LAYER'); g(2, n); g(70, 0); g(62, c); g(6, 'CONTINUOUS'); }
  g(0, 'ENDTAB');
  g(0, 'TABLE'); g(2, 'STYLE'); g(70, 1); g(0, 'STYLE'); g(2, 'KOR'); g(70, 0); g(40, 0); g(41, 1); g(50, 0); g(71, 0); g(42, 2.5); g(3, 'malgun.ttf'); g(4, ''); g(0, 'ENDTAB');
  g(0, 'ENDSEC');
  g(0, 'SECTION'); g(2, 'ENTITIES');
  const poly = (layer, pts, closed) => {
    g(0, 'POLYLINE'); g(8, layer); g(66, 1); g(10, 0); g(20, 0); g(30, 0); g(70, closed ? 1 : 0);
    for (const [x, y] of pts) { g(0, 'VERTEX'); g(8, layer); g(10, x); g(20, y); g(30, 0); }
    g(0, 'SEQEND'); g(8, layer);
  };
  const text = (layer, x, y, h, s) => { g(0, 'TEXT'); g(8, layer); g(10, x); g(20, y); g(30, 0); g(40, h); g(1, dxfText(s)); g(7, 'KOR'); };
  for (let n = 1; n <= pdfDoc.numPages; n++) {
    const ms = pageMarks(n); const T = pageTransform(n); const info = pageInfo[n];
    if (!T.cad) {
      if (!ms.length) continue;
      poly('FIELD_FRAME', [T.f(0, 0), T.f(info.W, 0), T.f(info.W, info.H), T.f(0, info.H)], true);
      const [lx, ly] = T.f(0, -8); text('FIELD_FRAME', lx, ly, 4, `${pad2(n)} ${info.title || ''}`);
    }
    const h = 6 * T.k;
    for (const m of ms) {
      const layer = STATUS[m.status].layer;
      if (m.kind === 'line') poly(layer, m.pts.map(p => T.f(p[0], p[1])), false);
      else if (m.kind === 'rect') { const [a, b] = m.pts; poly(layer, [T.f(a[0], a[1]), T.f(b[0], a[1]), T.f(b[0], b[1]), T.f(a[0], b[1])], true);
        if (m.status === 'fix') { poly(layer, [T.f(a[0], a[1]), T.f(b[0], b[1])], false); poly(layer, [T.f(b[0], a[1]), T.f(a[0], b[1])], false); } }
      else { const [x, y] = T.f(m.pts[0][0], m.pts[0][1]); g(0, 'CIRCLE'); g(8, layer); g(10, x); g(20, y); g(30, 0); g(40, 5 * T.k); }
      const [ax, ay] = anchorOf(m); const [tx, ty] = T.f(ax + (m.kind === 'pin' ? 7 : 3), ay - 3);
      text('FIELD_TEXT', tx, ty, h, `${m.no ? m.no + ' ' : ''}${m.type} [${STATUS[m.status].label}]`);
      const d = dimsText(m); if (d) text('FIELD_TEXT', tx, ty - h * 1.4, h * 0.85, d);
    }
  }
  g(0, 'ENDSEC'); g(0, 'EOF');
  return L.join('\r\n') + '\r\n';
}
function csvCell(v){ const s = String(v ?? ''); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function buildCsv(){
  const head = ['도면번호','도면명','번호','상태','부재명','손상내용','균열폭(mm)','너비(m)','길이(m)','개소','수량','단위','메모','사진수','X','Y','좌표기준'];
  const rows = [head];
  const ms = [...proj.marks].sort((a, b) => a.page - b.page || ST_ORDER.indexOf(a.status) - ST_ORDER.indexOf(b.status) || num(a.no) - num(b.no));
  for (const m of ms) {
    const T = pageTransform(m.page); const [ax, ay] = anchorOf(m); const [X, Y] = T.f(ax, ay);
    rows.push([pad2(m.page), pageInfo[m.page]?.title || '', m.no, STATUS[m.status].label, m.member, m.type, isCrack(m.type) ? m.crackW : '', isCrack(m.type) ? '' : m.w, m.l, m.n, calcQty(m), m.unit, m.memo, m.photos?.length || 0, X.toFixed(3), Y.toFixed(3), T.cad ? 'CAD' : '도면(mm)']);
  }
  return '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
}
const getCap = name => { try { return window.claude?.use ? window.claude.use(name) : Promise.resolve(null); } catch (e) { return Promise.resolve(null); } };
async function doExport(){
  if (!proj || !proj.marks.length) { toast('내보낼 표기가 없습니다'); return; }
  if (proj.marks.some(m => m.example)) {
    const ok = await modal({title:'예시 표기가 남아 있습니다', body:'예시 3건도 함께 내보낼까요? 실제 성과품이면 먼저 예시를 지우세요.', ok:'그대로 내보내기'});
    if (!ok) return;
  }
  if (!window.JSZip) { toast('압축 모듈을 불러오지 못했습니다. 새로고침해 주세요.'); return; }
  toast('파일을 만드는 중…', 3000);
  const zip = new JSZip();
  const base = proj.name.replace(/\.pdf$/i, '').replace(/[\\/:*?"<>|]/g, '_');
  zip.file('손상목록.csv', buildCsv());
  zip.file('현장표기.dxf', buildDxf());
  const photoFiles = {};
  for (const m of proj.marks) {
    for (let i = 0; i < (m.photos || []).length; i++) {
      const b = await dbGet('photos', m.photos[i]); if (!b) continue;
      const path = `사진/${pad2(m.page)}_${(m.no || 'x').replace(/[\\/:*?"<>|]/g, '_')}_${m.type.replace(/[\\/:*?"<>|]/g, '_')}_${i + 1}.jpg`;
      zip.file(path, b); photoFiles[m.photos[i]] = path;
    }
  }
  zip.file('원본데이터.json', JSON.stringify({app:'field-damage', v:1, key:proj.key, name:proj.name, pages:proj.pages, marks:proj.marks, photoFiles, exported:new Date().toISOString()}, null, 1));
  const blob = await zip.generateAsync({type:'blob', compression:'DEFLATE'});
  const d = new Date(); const stamp = `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}`;
  await saveFile(blob, `${base}_현장조사_${stamp}.zip`);
}
async function saveFile(blob, filename){
  const file = new File([blob], filename, {type:'application/zip'});
  let canShare = false; try { canShare = !!(navigator.canShare && navigator.canShare({files:[file]})); } catch (e) {}
  const ok = await modal({
    title:'내보내기 파일이 준비됐습니다',
    html:`<p class="num" style="word-break:break-all">${esc(filename)}<br>${(blob.size / 1048576).toFixed(1)} MB · CAD용 DXF, 손상목록 CSV, 사진 포함</p>${canShare ? '<button class="btn" id="shareBtn">카톡·메일·드라이브로 보내기</button>' : ''}`,
    ok:'다운로드 폴더에 저장', cancel:'닫기',
    onOpen:{init:root => { const b = root.querySelector('#shareBtn'); if (b) b.onclick = async () => { $('#modalRoot').innerHTML = ''; try { await navigator.share({files:[file], title:filename}); } catch (e) {} }; }, collect:() => true}
  });
  if (!ok) return;
  const u = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = u; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 60000);
  toast('다운로드 폴더에 저장했습니다', 3500);
}
async function importBackup(file){
  let data, zip = null;
  try {
    if (/\.zip$/i.test(file.name)) { zip = await JSZip.loadAsync(file); const j = zip.file('원본데이터.json'); if (!j) throw new Error('no json'); data = JSON.parse(await j.async('string')); }
    else data = JSON.parse(await file.text());
    if (!Array.isArray(data.marks)) throw new Error('bad');
  } catch (e) { toast('백업 파일을 읽을 수 없습니다. 이 앱에서 내보낸 zip이나 json을 선택해 주세요.', 4000); return; }
  const other = data.key && data.key !== proj.key;
  const ok = await modal({title:'백업 불러오기', body:`현재 도면의 표기 ${proj.marks.length}건을 백업의 ${data.marks.length}건으로 바꿉니다.${other ? ' 백업은 다른 도면 파일(' + (data.name || '') + ')에서 만든 것입니다.' : ''}`, ok:'바꾸기'});
  if (!ok) return;
  if (zip && data.photoFiles) {
    for (const [pid, path] of Object.entries(data.photoFiles)) { const f = zip.file(path); if (f) await dbSet('photos', pid, await f.async('blob')); }
  }
  pushUndo(); proj.marks = data.marks; proj.pages = data.pages || proj.pages; saveProj(); refresh(); toast(`${data.marks.length}건을 불러왔습니다`);
}

    {...base, id:uid(), page:2, kind:'pin', pts:[[481, 254]], status:'chg', no:'4', member:'조작대', type:'표면오염', w:'0.6', l:'7.0', unit:'㎡', qty:4.2, memo:'예시 · 폭 0.5→0.6m 진전'},

/* ---------- wiring ---------- */
document.querySelectorAll('.tool[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
$('#fitBtn').onclick = () => fit();
$('#undoBtn').onclick = () => undo();
$('#fingerBtn').onclick = () => { fingerDraw = !fingerDraw; $('#fingerBtn').setAttribute('aria-pressed', fingerDraw); $('#hintPill').textContent = fingerDraw ? '한 손가락으로 그리고, 두 손가락으로 이동·확대합니다.' : 'S펜으로 그리면 손상이 추가되고, 손가락으로 끌거나 벌리면 도면이 움직입니다.'; };
function goPage(d){ if (!pdfDoc) return; const n = clamp(pageNo + d, 1, pdfDoc.numPages); if (n !== pageNo) showPage(n); }
$('#prevPg').onclick = () => goPage(-1);
$('#nextPg').onclick = () => goPage(1);
$('#pageSel').onchange = e => showPage(+e.target.value);
$('#toggleSide').onclick = () => { const on = els.app.classList.toggle('noside'); $('#toggleSide').setAttribute('aria-pressed', !on); setTimeout(() => { if (pdfDoc) applyView(); }, 0); };
$('#exportBtn').onclick = () => { if (proj) doExport(); else toast('먼저 도면 PDF를 열어 주세요'); };
$('#pdfInput').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const bytes = new Uint8Array(await f.arrayBuffer());
  await openPdf(bytes, f.name);
};
$('#bakInput').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (f && proj) importBackup(f); };
$('#clearEx').onclick = () => { pushUndo(); proj.marks = proj.marks.filter(m => !m.example); saveProj(); refresh(); toast('예시를 지웠습니다'); };
document.addEventListener('visibilitychange', () => { if (document.hidden && proj) { clearTimeout(saveTimer); dbSet('kv', 'proj:' + proj.key, JSON.parse(JSON.stringify(proj))); } });
if (window.matchMedia('(max-width:760px)').matches) { els.app.classList.add('noside'); $('#toggleSide').setAttribute('aria-pressed', 'false'); }
setTool('line');

function showEmpty(){
  const l = $('#loading'); l.hidden = false;
  l.innerHTML = '<div><b style="font-size:16px;color:var(--ink)">외관조사망도 PDF를 열어 주세요</b><br>CAD에서 출력한 PDF를 열면 S펜으로 손상을 표기할 수 있습니다.<br>표기한 내용은 이 태블릿에 자동 저장되고, 같은 파일을 다시 열면 이어서 작업합니다.<br><label class="btn primary" for="pdfInput">도면 PDF 열기</label></div>';
}
/* install + offline */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('#installBtn').hidden = false; });
$('#installBtn').onclick = async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} installEvt = null; $('#installBtn').hidden = true; };
window.addEventListener('appinstalled', () => { $('#installBtn').hidden = true; toast('홈 화면에 설치했습니다'); });
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
try { navigator.storage?.persist?.(); } catch (e) {}

(async function boot(){
  if (!window.pdfjsLib) { $('#loading').textContent = 'PDF 모듈을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요.'; return; }
  try {
    const last = await dbGet('kv', 'last');
    if (last) {
      const bytes = await dbGet('kv', 'pdf:' + last);
      if (bytes) { const name = last.split('|')[0]; await openPdf(bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes), name); return; }
    }
  } catch (e) {}
  showEmpty();
})();
})();
</script>
